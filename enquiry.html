<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Crust Bakery | Enquiry</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">Golden Crust Bakery</div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="enquiry.html">Enquiry</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Custom Order Enquiry</h2>
      <p>Planning a birthday, wedding, or event? Tell us what you need and we'll get back to you with a quote.</p>

      <form id="enquiry-form">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone">

        <label for="product">Product of Interest *</label>
        <select id="product" name="product" required>
          <option value="">-- Select an option --</option>
          <option value="cake">Custom Cake</option>
          <option value="catering">Catering / Bulk Order</option>
          <option value="other">Other</option>
        </select>

        <label for="date">Date Needed</label>
        <input type="date" id="date" name="date">

        <label for="message">Details *</label>
        <textarea id="message" name="message" required placeholder="Tell us about your order (flavour, size, number of guests, etc.)"></textarea>

        <button type="submit" class="btn" style="margin-top:20px;">Submit Enquiry</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Golden Crust Bakery | [Your Student Number]</p>
    <p><a href="contact.html">Contact us</a> | 123 Main Street, Johannesburg</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
